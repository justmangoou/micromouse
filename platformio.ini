; Blue Pill (STM32F103C8) firmware, the run mode in src/course.cpp.
;   pio run -e course_nav -t upload   block course, A* (src/course.cpp), low-memory planner (-DNAV_LOW_MEMORY)
;   pio test -e native                host tests of lib/, no hardware needed
;   pio test -e native_lowmem         the same tests against the low-memory planner

[platformio]
default_envs = course_nav

[env]
; Let the editor resolve Unity in host test files while a firmware environment is selected.
build_flags = -std=gnu++17 -Wall -Wno-unused-parameter -I test -I .pio/libdeps/native/Unity/src

[bluepill]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
; Cortex-M3: no FPU, floats are software. -u _printf_float is only for the test builds that print floats.
build_flags = ${env.build_flags} -fno-exceptions -Wno-unused-variable

[env:course_nav]
extends = bluepill
; The planner's full-resolution arrays need ~46 KB; the Blue Pill has 20 KB, so build the low-memory planner (~13 KB).
build_flags = ${bluepill.build_flags} -DNAV_LOW_MEMORY
build_src_filter = +<*> -<test_tof.cpp> -<test_tof_single.cpp> -<test_imu.cpp> -<test_i2c_scan.cpp> -<test_motor.cpp> -<test_spin.cpp> -<test_planner.cpp> -<test_tof_cal.cpp> -<test_step.cpp>

; Stationary bring-up of one sensor each. printf is plain text here, for `pio device monitor` on the USART1 link
; (wired adapter, 115200 baud); results are also visible through ST-Link as gTofTest / gTofSingle / gImuTest.
; test_tof_single wakes one sensor (default index 0; add -DTOF_TEST_INDEX=n to pick another).
[env:test_tof]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<tof_array.cpp> +<test_tof.cpp>
build_flags = ${bluepill.build_flags} -g3

[env:test_tof_single]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<test_tof_single.cpp>
build_flags = ${bluepill.build_flags} -g3

[env:test_imu]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<test_imu.cpp>
build_flags = ${bluepill.build_flags} -g3 -Wl,-u,_printf_float

[env:test_i2c_scan]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<test_i2c_scan.cpp>
build_flags = ${bluepill.build_flags} -g3

; Open-loop motor / encoder / button check driven from ST-Link (see src/test_motor.cpp). No I2C.
[env:test_motor]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<test_motor.cpp>
build_flags = ${bluepill.build_flags} -g3

; Spin in place and compare gyro yaw with encoder yaw (see src/test_spin.cpp). Needs I2C.
[env:test_spin]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<test_spin.cpp>
build_flags = ${bluepill.build_flags} -g3

; Planner timing and stack headroom on the real chip, no motors (see src/test_planner.cpp).
[env:test_planner]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<test_planner.cpp>
build_flags = ${bluepill.build_flags} -g3 -DNAV_LOW_MEMORY

; Motor step response, wheels OFF THE GROUND (see src/test_step.cpp). Read the result with tools/read_step.py.
[env:test_step]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<test_step.cpp>
build_flags = ${bluepill.build_flags} -g3

; The same on the FLOOR, three low duty levels, needs ~1.5 m of clear straight: gives the loaded gain.
[env:test_step_floor]
extends = env:test_step
build_flags = ${env:test_step.build_flags} -DSTEP_FLOOR

; Offset calibration of all ToF sensors with a flat target at -DCAL_MM (default 100): see src/test_tof_cal.cpp.
[env:test_tof_cal]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<test_tof_cal.cpp>
build_flags = ${bluepill.build_flags} -g3

; Same, for one sensor only after replacing it (here F, index 1).
[env:test_tof_cal_f]
extends = env:test_tof_cal
build_flags = ${env:test_tof_cal.build_flags} -DCAL_ONLY=1

[env:native]
platform = native
test_framework = unity
lib_ignore = vl53l0x_api, vl53l0x_impl, mpu6050, i2c_bus

; The same host tests against the low-memory planner that course_nav runs on the Blue Pill.
[env:native_lowmem]
platform = native
test_framework = unity
lib_ignore = vl53l0x_api, vl53l0x_impl, mpu6050, i2c_bus
build_flags = ${env.build_flags} -DNAV_LOW_MEMORY
