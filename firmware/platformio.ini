; Two firmware builds, one per navigation mode; they share everything in src/ except the mode file.
;   pio run -e micromouse -t upload          16 x 16 maze, flood fill (src/maze.cpp)
;   pio run -e obstacle_avoidance -t upload  block course, A* (src/course.cpp)
;   pio test -e native                       host tests of lib/, no hardware needed

[platformio]
default_envs = micromouse

[env]
; Let the editor resolve Unity in host test files while a firmware environment is selected.
build_flags = -std=gnu++17 -Wall -Wno-unused-parameter -I test -I .pio/libdeps/native/Unity/src

[blackpill]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
monitor_speed = 460800
extra_scripts = pre:fpu_flags.py
build_flags = ${env.build_flags} -fno-exceptions -Wno-unused-variable

[env:micromouse]
extends = blackpill
build_src_filter = +<*> -<course.cpp>

[env:obstacle_avoidance]
extends = blackpill
build_src_filter = +<*> -<maze.cpp>

[env:native]
platform = native
test_framework = unity
lib_ignore = vl53l0x_api, vl53l0x_impl, mpu6050, i2c_bus, hc05
