; Two firmware builds, one per navigation mode; they share everything in src/ except the mode file.
;   pio run -e micromouse -t upload          16 x 16 maze, flood fill (src/maze.cpp)
;   pio run -e course_nav -t upload  block course, A* (src/course.cpp)
;   pio test -e native                       host tests of lib/, no hardware needed

[platformio]
default_envs = micromouse

[env]
; Let the editor resolve Unity in host test files while a firmware environment is selected.
build_flags = -std=gnu++17 -Wall -Wno-unused-parameter -I test -I .pio/libdeps/native/Unity/src

[blackpill]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
monitor_speed = 9600
extra_scripts = pre:fpu_flags.py
build_flags = ${env.build_flags} -fno-exceptions -Wno-unused-variable

[env:micromouse]
extends = blackpill
build_src_filter = +<*> -<course.cpp> -<manual.cpp> -<tof_test.cpp> -<tof_single_test.cpp> -<imu_test.cpp> -<comms_test.cpp>

[env:course_nav]
extends = blackpill
build_src_filter = +<*> -<maze.cpp> -<manual.cpp> -<tof_test.cpp> -<tof_single_test.cpp> -<imu_test.cpp> -<comms_test.cpp>

; Drive the wheels from the host with tools/console.py (no navigation). Wheels off the ground for the first try.
[env:manual]
extends = blackpill
build_src_filter = +<*> -<maze.cpp> -<course.cpp> -<tof_test.cpp> -<tof_single_test.cpp> -<imu_test.cpp> -<comms_test.cpp>

; Stationary bring-up of one sensor each. printf is plain text here, for `pio device monitor` on the USART1 link
; (HC-05 or a wired adapter, 9600 baud); results are also visible through ST-Link as gTofTest / gTofSingle / gImuTest.
; tof_single_test wakes one sensor (default index 0; add -DTOF_TEST_INDEX=n to pick another).
[env:tof_test]
extends = blackpill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<remote.cpp> +<tof_array.cpp> +<tof_test.cpp>
build_flags = ${blackpill.build_flags} -g3 -DREMOTE_PLAIN_TEXT

[env:tof_single_test]
extends = blackpill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<remote.cpp> +<tof_single_test.cpp>
build_flags = ${blackpill.build_flags} -g3 -DREMOTE_PLAIN_TEXT

[env:imu_test]
extends = blackpill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<remote.cpp> +<imu_test.cpp>
build_flags = ${blackpill.build_flags} -g3 -DREMOTE_PLAIN_TEXT -Wl,-u,_printf_float

[env:native]
platform = native
test_framework = unity
lib_ignore = vl53l0x_api, vl53l0x_impl, mpu6050, i2c_bus

; Packet link check over the HC-05 (or wired) with tools/console.py. Match COMMS_TEST_BAUD to the module's UART baud.
[env:comms_test]
extends = blackpill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<remote.cpp> +<comms_test.cpp>
build_flags = ${blackpill.build_flags} -g3 -DCOMMS_TEST_BAUD=9600
monitor_speed = 9600
