[platformio]
default_envs = blackpill_f411ce

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
monitor_speed = 460800
extra_scripts = pre:fpu_flags.py
build_flags =
    -DLED_BLINK_TEST
    -std=gnu++17
    -fno-exceptions
    -Wall
    -Wno-unused-parameter
    -Wno-unused-variable

; Build/upload exactly one navigation mode. The original environment remains
; available for LED-only board bring-up.
[env:obstacle_avoidance]
extends = env:blackpill_f411ce
build_flags =
    -DNAV_MODE=NAV_OBSTACLE_AVOIDANCE
    -std=gnu++17
    -fno-exceptions
    -Wall
    -Wno-unused-parameter
    -Wno-unused-variable
extra_scripts = pre:fpu_flags.py, pre:nav_sources.py

[env:micromouse]
extends = env:obstacle_avoidance
build_flags =
    -DNAV_MODE=NAV_MICROMOUSE
    -std=gnu++17
    -fno-exceptions
    -Wall
    -Wno-unused-parameter
    -Wno-unused-variable

; Host-side unit tests of lib/nav (odometry, planner, navigator) -- no hardware needed.
[env:native]
platform = native
test_framework = unity
lib_ignore = vl53l0x_api, vl53l0x_impl, mpu6050, i2c_bus, hc05
build_flags = -std=gnu++17 -Wall -Wno-unused-parameter
