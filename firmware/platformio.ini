; Blue Pill (STM32F103C8) firmware, two builds that share everything in src/ except the mode file.
;   pio run -e course_nav -t upload   block course, A* (src/course.cpp). DOES NOT LINK on the F103 yet: the planner needs
;                                     ~46 KB of static RAM and the chip has 20 KB
;   pio run -e manual -t upload       drive the wheels from the host (src/manual.cpp)
;   pio test -e native                host tests of lib/, no hardware needed

[platformio]
default_envs = manual

[env]
; Let the editor resolve Unity in host test files while a firmware environment is selected.
build_flags = -std=gnu++17 -Wall -Wno-unused-parameter -I test -I .pio/libdeps/native/Unity/src

[bluepill]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 9600
; Cortex-M3: no FPU, floats are software. -u _printf_float is only for the test builds that print floats.
build_flags = ${env.build_flags} -fno-exceptions -Wno-unused-variable

[env:course_nav]
extends = bluepill
build_src_filter = +<*> -<manual.cpp> -<tof_test.cpp> -<tof_single_test.cpp> -<imu_test.cpp> -<comms_test.cpp> -<i2c_scan_test.cpp> -<motor_test.cpp>

; Drive the wheels from the host with tools/console.py (no navigation). Wheels off the ground for the first try.
[env:manual]
extends = bluepill
build_src_filter = +<*> -<course.cpp> -<tof_test.cpp> -<tof_single_test.cpp> -<imu_test.cpp> -<comms_test.cpp> -<i2c_scan_test.cpp> -<motor_test.cpp>

; Stationary bring-up of one sensor each. printf is plain text here, for `pio device monitor` on the USART1 link
; (HC-05 or a wired adapter, 9600 baud); results are also visible through ST-Link as gTofTest / gTofSingle / gImuTest.
; tof_single_test wakes one sensor (default index 0; add -DTOF_TEST_INDEX=n to pick another).
[env:tof_test]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<remote.cpp> +<tof_array.cpp> +<tof_test.cpp>
build_flags = ${bluepill.build_flags} -g3 -DREMOTE_PLAIN_TEXT

[env:tof_single_test]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<remote.cpp> +<tof_single_test.cpp>
build_flags = ${bluepill.build_flags} -g3 -DREMOTE_PLAIN_TEXT

[env:imu_test]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<remote.cpp> +<imu_test.cpp>
build_flags = ${bluepill.build_flags} -g3 -DREMOTE_PLAIN_TEXT -Wl,-u,_printf_float

[env:i2c_scan_test]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<remote.cpp> +<i2c_scan_test.cpp>
build_flags = ${bluepill.build_flags} -g3

; Open-loop motor / encoder / button check driven from ST-Link (see src/motor_test.cpp). No I2C.
[env:motor_test]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<remote.cpp> +<motor_test.cpp>
build_flags = ${bluepill.build_flags} -g3

[env:native]
platform = native
test_framework = unity
lib_ignore = vl53l0x_api, vl53l0x_impl, mpu6050, i2c_bus

; Packet link check over the HC-05 (or wired) with tools/console.py. Match COMMS_TEST_BAUD to the module's UART baud.
[env:comms_test]
extends = bluepill
build_src_filter = +<board.cpp> +<syscalls.cpp> +<interrupts.cpp> +<motor.cpp> +<remote.cpp> +<comms_test.cpp>
build_flags = ${bluepill.build_flags} -g3 -DCOMMS_TEST_BAUD=9600
monitor_speed = 9600
